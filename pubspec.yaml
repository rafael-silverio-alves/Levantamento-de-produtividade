name: levantamento_de_produtividade
description: App para apontamento de produtividade agrícola com suporte offline
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  
  # Banco de dados local (Hive)
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  path_provider: ^2.1.1
  
  # Supabase
  supabase_flutter: ^2.5.0
  
  # Conectividade
  connectivity_plus: ^5.0.2
  
  # Gerenciamento
  provider: ^6.1.1
  
  # Utilitários
  intl: ^0.18.1
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true